name: landlensfrontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.1+13

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  pdfx: ^2.8.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/ardhilens_icon.png
  adaptive_icon_background: "#0A3D2E"
  adaptive_icon_foreground: assets/icons/ardhilens_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/ardhilens_icon.png
